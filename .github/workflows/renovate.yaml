---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Renovate"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Manual runs from the Actions tab replace the hosted-app "run now" button.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        # Self-hosted replacement for the hosted Mend.io Renovate app, which
        # ran this repo on an uncontrolled cadence (2-12h discovery gaps).
        # Auth: dedicated bot PAT stored as the RENOVATE_BOT_TOKEN repo secret.
        # Config: .renovaterc.json5 at the repo root is picked up automatically.
        # The action only forwards RENOVATE_*/GITHUB_COM_TOKEN/LOG_LEVEL/... env
        # vars into the container, so platform/repositories/auth are set here
        # (RENOVATE_* names map 1:1 to Renovate config options).
        env:
          GITHUB_TOKEN: ${{ secrets.RENOVATE_BOT_TOKEN }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_BOT_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_BOT_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: rafelbev/garage-ops
          RENOVATE_GIT_AUTHOR: "Renovate Bot <rafelbev-renovate-bot@users.noreply.github.com>"
          RENOVATE_USERNAME: rafelbev-renovate-bot
          RENOVATE_VERSION: 44.222.4
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
