---
# PostgreSQL data volume for the Forgejo database (iSCSI for single-writer performance)
# 2Gi is generous: the source database was 337 MB on PostgreSQL 11.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: forgejo-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 2Gi
