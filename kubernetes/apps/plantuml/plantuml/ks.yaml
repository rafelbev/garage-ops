---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plantuml
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: plantuml
      namespace: plantuml
  interval: 1h
  path: ./kubernetes/apps/plantuml/plantuml/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: plantuml
