---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n-sandbox
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: sandbox-n8n-sandbox-service-api
      namespace: n8n-sandbox
  interval: 1h
  path: ./kubernetes/apps/n8n-sandbox/n8n-sandbox/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: n8n-sandbox
