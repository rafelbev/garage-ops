---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-sandbox
  namespace: n8n-sandbox
spec:
  hostnames:
    - sandbox.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: n8n-sandbox-api
          namespace: n8n-sandbox
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
