---
# DRA DeviceClass (resource.k8s.io/v1) exposing the GPU-capable node's
# NVIDIA devices to workloads. The NVIDIA driver (installed as a Talos
# system extension on cluster-4) publishes the device in a ResourceSlice;
# this class selects it for explicit DRA claims (resourceClaims +
# DeviceClass).
#
# NOTE: this class deliberately does NOT set extendedResourceName.
# Since Kubernetes 1.37 (DRA Extended Resource, stable, KEP-5004) a single
# node must not provide the same extended resource through both DRA and a
# device plugin, and the NVIDIA GPU Operator's device plugin now owns
# nvidia.com/gpu on cluster-4 (see kubernetes/apps/gpu-operator/). The
# classic resources.limits: {nvidia.com/gpu: 1} syntax is satisfied by the
# device plugin (time-sliced); explicit DRA claims through this class keep
# working, as does the implicit name deviceclass.resource.kubernetes.io/gpu.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu
spec:
  selectors:
    - cel:
        # v1 CEL selectors only expose device.driver and device.name
        # (device labels are not addressable in v1), so select by driver.
        # The NVIDIA DRA driver registers as "nvidia.com/gpu".
        expression: 'device.driver == "nvidia.com/gpu"'
