---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-cpp
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-cpp
      namespace: llama-cpp
  interval: 1h
  path: ./kubernetes/apps/llama-cpp/llama-cpp/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llama-cpp
