---
# Static PersistentVolumeClaim binding the cluster-4 local scratch disk.
#
# The HuggingFace model cache now lives here (subPath `huggingface`)
# instead of the old TrueNAS NFS export.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-scratch
  namespace: llama-cpp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 128Gi
  volumeName: llama-cpp-scratch-pv
