---
# Static PersistentVolume for the local 128 GiB scratch disk on cluster-4.
#
# Backed by the Talos user volume mounted at /var/mnt/llama-cpp (see
# talos/node/cluster-4/60-disk.yaml): Talos wipes, formats (ext4) and mounts
# the whole disk, persisting across reboots. Node-affinitized to cluster-4.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-cpp-scratch-pv
spec:
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cluster-4
  hostPath:
    path: /var/mnt/llama-cpp
    type: Directory
