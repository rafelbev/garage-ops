---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp
  namespace: llama-cpp
spec:
  hostnames:
    - llama-cpp.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: llama-cpp
          namespace: llama-cpp
          port: 9931
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
