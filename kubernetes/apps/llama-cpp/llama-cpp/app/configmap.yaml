---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-models
data:
  models.ini: |
    version = 1

    ; ===================================================================
    ; [*] — shared by every model (override any of these per-model below)
    ; ===================================================================
    [*]
    ; hardware / threading
    threads = 4
    threads-batch = 4
    threads-http = 2
    n-gpu-layers = auto
    flash-attn = on
    load-mode = mmap
    kv-unified = true

    ; context / KV cache
    ctx-size = 262144
    ctx-checkpoints = 256
    cache-type-k = q8_0
    cache-type-v = q4_0
    cache-prompt = true
    cache-reuse = 1024
    kv-tail-tokens = auto
    parallel = 1

    ; batching
    batch-size = 512        ; was: -b
    ubatch-size = 1024      ; was: -ub

    ; misc
    perf = true
    log-verbosity = 4      ; was: -lv 4
    slots = true

    ; ================================================================
    ; Qwen3.8 27B SWIFT 1.5 GSQ-RCO + MTP
    ; ================================================================
    [ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF]
    alias = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS-mtp
    hf-repo = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS-mtp
    spec-type = draft-mtp
    spec-draft-ngl = all
    spec-draft-n-max = 4
    spec-draft-n-min = 2
    load-on-startup = true

    ; context / KV cache
    ctx-size = 262144
    ctx-checkpoints = 256
    cache-type-k = kvarn3
    cache-type-v = kvarn3

    ; sampling
    temp = 1.0
    top-p = 0.95
    top-k = 20
    min-p = 0.00
    repeat-penalty = 1.0
    presence-penalty = 0.0

    ; chat / reasoning
    jinja = true
    chat-template-kwargs = {"parallel_tool_calls":true, "reasoning_effort": "medium"}
    reasoning = on
    reasoning-format = auto
    reasoning-preserve = true

    parallel = 2

    ; ================================================================
    ; Underdog Saluki 27B 1.0 (IQ2-mix) — DEFAULT model
    ; Qwen3.8-27B 2-bit GGUF tuned to keep tool calling intact; runs on
    ; stock llama.cpp (no GPU Operator / device plugin needed).
    ;   - DFlash2 speculative decoding via a separate drafter repo
    ;     (z-lab/Qwen3.8-27B-DFlash2-GGUF); the drafter is NOT in the
    ;     Saluki repo, so hf-repo-draft points at it explicitly.
    ;   - Vision (mmproj) is auto-downloaded by the server from the repo.
    ; ================================================================
    [ConwayResearch/Underdog-Saluki-27B-1.0]
    alias = ConwayResearch/Underdog-Saluki-27B-1.0
    hf-repo = ConwayResearch/Underdog-Saluki-27B-1.0
    hf-file = Underdog-Saluki-27B-1.0-IQ2-mix.gguf
    load-on-startup = false

    ; DFlash2 speculative decoding (draft-dflash)
    spec-type = draft-dflash
    hf-repo-draft = z-lab/Qwen3.8-27B-DFlash2-GGUF:Q4_K_M
    spec-draft-n-max = 4
    spec-draft-ngl = all

    ; context / KV cache (q4_0/q4_0 keeps 256K within the 22Gi host limit)
    ctx-size = 262144
    ctx-checkpoints = 256
    cache-type-k = q4_0
    cache-type-v = q4_0

    ; sampling — tuned for agentic / coding (deterministic, small safety net)
    temp = 0.6
    top-p = 0.95
    top-k = 20
    min-p = 0.05
    repeat-penalty = 1.0
    presence-penalty = 0.0

    ; chat / reasoning — thinking ON at the least effort that retains quality
    jinja = true
    chat-template-kwargs = {"parallel_tool_calls":true, "reasoning_effort": "low"}
    reasoning = on
    reasoning-format = auto
    reasoning-preserve = true

    parallel = 2

    ; ================================================================
    ; ggml-org/tiny-llamas
    ; ================================================================
    [ggml-org/tiny-llamas]
    alias = ggml-org/tiny-llamas
    hf-repo = ggml-org/tiny-llamas

    ; context / KV cache
    ctx-size = 32768
    ctx-checkpoints = 256
    cache-type-k = q4_0
    cache-type-v = q4_0

    parallel = 2
