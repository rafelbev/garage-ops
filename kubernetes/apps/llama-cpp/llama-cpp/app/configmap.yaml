---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-models
data:
  models.ini: |
    version = 1

    ; ===================================================================
    ; [*] — shared by every model (override any of these per-model below)
    ; ===================================================================
    version = 1

    ; =====================================================================
    ; ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO (IQ3_XXS-mtp)
    ; Target: 22 GB NVIDIA card, 256K context, q4 KV, MTP spec decode
    ; =====================================================================

    ; ---- Global server defaults (shared by every model in this file) ----
    [*]
    threads = 4
    threads-batch = 4
    threads-http = 2
    perf = true
    log-verbosity = 4

    ; memory / context
    n-gpu-layers = auto
    load-mode = mmap
    flash-attn = on
    kv-unified = true
    cache-prompt = true
    cache-reuse = 1024
    fit = on

    batch-size = 512
    ubatch-size = 1024

    ; SINGLE slot: keeps the KV pool at 256K instead of 512K (~3 GB saved).
    ; Bump to 2 only if you genuinely need two concurrent conversations.
    parallel = 1

    ; sampling
    temp = 1.0
    top-p = 0.95
    top-k = 20
    min-p = 0.00
    repeat-penalty = 1.0
    presence-penalty = 0.0

    ; chat / reasoning
    jinja = true
    reasoning = on
    reasoning-format = auto
    reasoning-preserve = true
    chat-template-kwargs = {"parallel_tool_calls":true, "reasoning_effort": "medium"}

    ; ---- Per-model preset ----
    [ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS-mtp]
    alias = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS-mtp
    hf-repo = ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_XXS-mtp
    load-on-startup = true

    ctx-size = 262144
    ; Capped at ~32 by the default 8192 checkpoint-min-step, so 256 was redundant.
    ; Safe to delete this line entirely if you're not using context branching.
    ctx-checkpoints = 16
    cache-type-k = q4_0
    cache-type-v = q4_0

    ; MTP speculative decoding
    spec-type = draft-mtp
    spec-draft-ngl = all
    spec-draft-n-max = 4
    spec-draft-n-min = 2
