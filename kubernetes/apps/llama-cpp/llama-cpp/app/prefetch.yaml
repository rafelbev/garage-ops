---
# One-shot Job that pre-downloads the default model into the HuggingFace
# cache (the local scratch-disk PVC) so the llama-server's first boot with
# a new model is fast: it finds the file already cached and skips the
# multi-GB download.
#
#   - Runs with NO GPU — it only writes to the local RWO volume, so it
#     never touches the running model's VRAM and cannot disturb it.
#   - Idempotent: `hf download` is a no-op when the file is already cached,
#     so re-applying (Flux reconcile) is safe and cheap.
#   - To prefetch a NEW model, change the repo / file below and re-apply.
#
# The server (llama-server --hf-repo) and this Job use the same huggingface_hub
# cache layout, so a file written here is picked up by the server on boot.
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-model-prefetch
  labels:
    app: llama-cpp
spec:
  completions: 1
  completionMode: Indexed
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prefetch
          image: ghcr.io/ggml-org/llama.cpp:full-cuda
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Prefetching ConwayResearch/Underdog-Saluki-27B-1.0 into the HF cache..."
              hf download ConwayResearch/Underdog-Saluki-27B-1.0 Underdog-Saluki-27B-1.0-IQ2-mix.gguf
              echo "Prefetching the DFlash2 drafter (z-lab/Qwen3.8-27B-DFlash2-GGUF)..."
              hf download z-lab/Qwen3.8-27B-DFlash2-GGUF Qwen3.8-27B-DFlash2-Q4_K_M.gguf
              echo "Verifying the files landed in the cache:"
              find /root/.cache/huggingface/hub -name "Underdog-Saluki-27B-1.0-IQ2-mix.gguf" -o -name "Qwen3.8-27B-DFlash2-Q4_K_M.gguf" \( -type f -o -type l \) -exec ls -la {} \;
          env:
            - name: HF_HUB_CACHE
              value: /root/.cache/huggingface/hub
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /root/.cache/huggingface
              subPath: huggingface
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-scratch
