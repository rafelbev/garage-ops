---
# Static PersistentVolume for models library
# Points to existing TrueNAS NFS export with all models downloaded
apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-pv
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 172.20.17.150
    path: /mnt/storage/models
  mountOptions:
    - hard
    - nfsvers=4
    - sync
    - noac
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
