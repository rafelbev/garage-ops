---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: sonarr
      namespace: sonarr
  interval: 1h
  path: ./kubernetes/apps/sonarr/sonarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: sonarr
