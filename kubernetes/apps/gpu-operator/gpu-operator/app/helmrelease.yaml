---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chart:
    spec:
      chart: gpu-operator
      sourceRef:
        kind: HelmRepository
        name: nvidia
      version: "v26.7.2"
  interval: 1h
  values:
    # The NVIDIA driver (kernel modules + userspace) and the container
    # toolkit are provided by the Talos system extensions on cluster-4
    # (siderolabs/nonfree-kmod-nvidia-lts +
    # siderolabs/nvidia-container-toolkit-lts, see talos/SPECIFICATION.md),
    # so the operator's driver and toolkit operands are disabled. The
    # operator provides the rest of the stack: device plugin, CDI spec
    # generation, DCGM exporter, NFD.
    driver:
      enabled: false
    toolkit:
      enabled: false
    # The CDI device spec is generated by the operator's CDI operand
    # (independent of the toolkit in the v26 chart). The NRI plugin is
    # part of the toolkit operand in this chart version and cannot be
    # enabled with the toolkit disabled - it is not needed here because
    # the containerd runtime wiring (CDI + nvidia runtime) comes from
    # the Sidero toolkit extension.
    cdi:
      enabled: true
      nriPluginEnabled: false
    # Host location of the driver userspace files installed by the
    # Sidero extension (matches the command recommended in Sidero's
    # nvidia-container-toolkit extension README).
    hostPaths:
      driverInstallDir: /usr/local
    # Do not pin the operand pods to the "nvidia" RuntimeClass: only
    # cluster-4 has the nvidia runtime configured, and the operands
    # (device plugin, CDI, exporter, NFD) do not need it themselves.
    # Left at the chart default ("nvidia"), the operand DaemonSets would
    # fail to start on the other three nodes.
    operator:
      runtimeClass: ""
    # Time-slicing: advertise the single physical GPU as 4 virtual
    # nvidia.com/gpu slots so multiple inference pods (llama.cpp, vllm,
    # whisper, ...) can be scheduled on cluster-4 at the same time.
    # The driver interleaves their kernels in time. NOTE: VRAM is NOT
    # partitioned - every pod sees the full 11GB and the models must be
    # sized so their combined working set fits.
    devicePlugin:
      config:
        create: true
        name: device-plugin-config
        default: default
        data:
          default: |
            version: v1
            sharing:
                timeSlicing:
                    renameByDefault: false
                    failRequestsGreaterThanOne: false
                    resources:
                        - name: nvidia.com/gpu
                          replicas: 4
    # Datacenter-only operands, all no-ops on a single consumer card:
    # no MIG (RTX), no GFD fleet feature discovery, no vGPU/vfio, no
    # confidential computing, no sandbox workloads.
    gfd:
      enabled: false
    migManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    vfioManager:
      enabled: false
    ccManager:
      enabled: false
    sandboxDevicePlugin:
      enabled: false
    kataSandboxDevicePlugin:
      enabled: false
