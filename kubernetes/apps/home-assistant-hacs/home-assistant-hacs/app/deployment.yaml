---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-hacs
  namespace: home-assistant-hacs
  labels:
    app: home-assistant-hacs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant-hacs
  template:
    metadata:
      labels:
        app: home-assistant-hacs
    spec:
      restartPolicy: Always
      containers:
        - name: home-assistant-hacs
          image: ghcr.io/hacs/home-assistant-hacs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: "Europe/Malta"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-hacs-config
