---
# Zendrite — the Matrix homeserver (migrated in-place from Dendrite).
#
# Same monolith pattern as Dendrite: single replica on an RWO iSCSI media PVC,
# config from Secrets, Postgres on the consolidated PG18. The in-memory
# JetStream is rebuilt from Postgres on every start, so the startup budget is
# generous on every boot, not just the first (see MIGRATION-TO-ZENDRITE.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zendrite
  namespace: matrix
  labels:
    app: zendrite
spec:
  replicas: 1
  # Single replica with an RWO iSCSI PVC: Recreate so the old pod terminates
  # and detaches the LUN before the replacement starts (RollingUpdate would
  # deadlock on the volume attach).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zendrite
  template:
    metadata:
      labels:
        app: zendrite
    spec:
      restartPolicy: Always
      # fsGroup 1000 makes the secret volumes group-owned by 1000 so the
      # non-root zendrite process (uid 1000) can read them (with mode 0660
      # below). Without this the 0600 root-owned secret files are unreadable
      # by uid 1000.
      securityContext:
        fsGroup: 1000
      # Dendrite wrote the media store as root (uid 0); Zendrite runs as uid 1000.
      # chown the store once so the non-root process can read and write it.
      # Idempotent: after the first run the files are already 1000:1000.
      initContainers:
        - name: chown-media
          image: pats22/zendrite:3.10.1
          securityContext:
            runAsUser: 0
          command: ["chown", "-R", "1000:1000", "/var/dendrite/media"]
          volumeMounts:
            - name: media
              mountPath: /var/dendrite/media
      containers:
        - name: zendrite
          image: pats22/zendrite:3.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Europe/Malta"
          ports:
            - containerPort: 8008
              name: http
              protocol: TCP
            - containerPort: 8448
              name: https
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Slow boot: zendrite migrates the DB schema (first run) and rebuilds
          # its in-memory jetstream from Postgres (~5.7GB of room/event state)
          # before the API binds. Keep a generous startup budget.
          startupProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            periodSeconds: 5
            failureThreshold: 600
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          volumeMounts:
            - name: zendrite-config
              mountPath: /etc/zendrite/zendrite.yaml
              subPath: zendrite.yaml
            - name: zendrite-config
              mountPath: /etc/whatsapp/registration.yaml
              subPath: registration.yaml
            - name: zendrite-key
              mountPath: /etc/zendrite/matrix_key.pem
              subPath: matrix_key.pem
            - name: media
              mountPath: /var/dendrite/media
            - name: logs
              mountPath: /var/log/dendrite
            - name: jetstream
              mountPath: /var/dendrite/jetstream
      volumes:
        - name: zendrite-config
          secret:
            secretName: zendrite-config
            defaultMode: 448
        - name: zendrite-key
          secret:
            secretName: zendrite-key
            defaultMode: 448
        - name: media
          persistentVolumeClaim:
            claimName: dendrite-media
        # Zendrite's logging hook writes to /var/log/dendrite (config:
        # logging[].params.path). /var/log is root-owned, so mount an emptyDir
        # there for the non-root process to write its rotated logs.
        - name: logs
          emptyDir: {}
        # JetStream (NATS) creates its storage directory even in in_memory
        # mode (config: global.jetstream.storage_path). /var/dendrite is
        # root-owned, so mount an emptyDir there. Transient: the in-memory
        # JetStream is rebuilt from Postgres on every start.
        - name: jetstream
          emptyDir: {}
