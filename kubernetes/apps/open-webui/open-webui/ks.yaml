---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: open-webui
      namespace: open-webui
  interval: 1h
  path: ./kubernetes/apps/open-webui/open-webui/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: open-webui
