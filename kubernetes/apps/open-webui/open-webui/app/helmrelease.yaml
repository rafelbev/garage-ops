---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
      version: "18.4.0"
  interval: 1h
  values:
    image:
      pullPolicy: Always
      repository: ghcr.io/open-webui/open-webui
      tag: v0.13.5
    ollama:
      enabled: false
    ollamaUrlsFromExtraEnv: false
    openaiBaseApiUrl: https://litellm.garage.neo-tix.com/v1
    # No API key required for the LiteLLM proxy — leave the chart's
    # openaiApiKey empty so no OPENAI_API_KEY env var is set (avoids the
    # chart's "0p3n-w3bu!" placeholder leaking to the backend).
    openaiApiKey: ""
    pipelines:
      enabled: false
    tika:
      enabled: false
    websocket:
      enabled: true
      manager: redis
      # Use the shared out-of-cluster Redis (redis.intranet.neo-tix.com, db3).
      # The connection URL lives in the sops-encrypted `open-webui` secret
      # (key `redis-url`); `redis.enabled: false` skips the bundled chart Redis.
      existingSecret: open-webui
      existingSecretKey: redis-url
      redis:
        enabled: false
    extraEnvVars:
      - name: WEBUI_URL
        value: https://chat.garage.neo-tix.com
      - name: PLAYWRIGHT_WS_URI
        value: ws://playwright.playwright.svc.cluster.local:9222
      - name: TOKENIZERS_PARALLELISM
        value: "true"
      # Stable, managed secret key — prevents Open WebUI from generating a
      # fresh key (and invalidating existing JWT sessions / encrypted state)
      # on every container restart. See README.md.
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui
            key: webui-secret-key
    persistence:
      accessModes:
        - ReadWriteOnce
      enabled: true
      size: 8Gi
      storageClass: truenas-iscsi
    ingress:
      enabled: false
    replicaCount: 1
    revisionHistoryLimit: 10
    resources:
      limits:
        cpu: "4"
        memory: 4G
      requests:
        cpu: "0.1"
        memory: 100m
    service:
      type: ClusterIP
      port: 80
      containerPort: 8080
