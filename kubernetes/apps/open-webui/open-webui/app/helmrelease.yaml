---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
      version: "18.4.0"
  interval: 1h
  values:
    image:
      pullPolicy: Always
      repository: ghcr.io/open-webui/open-webui
      tag: v0.13.5
    ollama:
      enabled: false
    ollamaUrlsFromExtraEnv: false
    openaiBaseApiUrl: https://litellm.garage.neo-tix.com/v1
    # No API key required for the LiteLLM proxy — leave the chart's
    # openaiApiKey empty so no OPENAI_API_KEY env var is set (avoids the
    # chart's "0p3n-w3bu!" placeholder leaking to the backend).
    openaiApiKey: ""
    pipelines:
      enabled: false
    tika:
      enabled: false
    websocket:
      enabled: true
      manager: redis
      # Use the shared out-of-cluster Redis (redis.intranet.neo-tix.com, db3).
      # The connection URL lives in the sops-encrypted `open-webui` secret
      # (key `redis-url`); `redis.enabled: false` skips the bundled chart Redis.
      existingSecret: open-webui
      existingSecretKey: redis-url
      redis:
        enabled: false
    extraEnvVars:
      - name: WEBUI_URL
        value: https://chat.garage.neo-tix.com
      - name: PLAYWRIGHT_WS_URI
        value: ws://playwright.playwright.svc.cluster.local:9222
      - name: TOKENIZERS_PARALLELISM
        value: "true"
      # Stable, managed secret key — prevents Open WebUI from generating a
      # fresh key (and invalidating existing JWT sessions / encrypted state)
      # on every container restart. See README.md.
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui
            key: webui-secret-key
      # --- PostgreSQL backend (was SQLite) ---
      # DATABASE_URL / PGVECTOR_DB_URL come from the sops-encrypted `open-webui`
      # secret (key `database-url`) so the Postgres password is never committed.
      # The app connects to the consolidated Postgres on 172.20.17.150:5432.
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: open-webui
            key: database-url
      # Use pgvector for the vector DB so both replicas share it (ChromaDB is
      # local-to-the-container and cannot be shared across replicas).
      - name: VECTOR_DB
        value: pgvector
      - name: PGVECTOR_DB_URL
        valueFrom:
          secretKeyRef:
            name: open-webui
            key: database-url
      # Migrations already applied to the database (see README); keep the
      # database in sync by running migrations on exactly one replica at a time
      # during upgrades.
      - name: ENABLE_DB_MIGRATIONS
        value: "false"
      # Tuned connection pools for a shared database (per the Open Web UI docs).
      - name: DATABASE_POOL_SIZE
        value: "15"
      - name: DATABASE_POOL_MAX_OVERFLOW
        value: "20"
      - name: THREAD_POOL_SIZE
        value: "2000"
    persistence:
      # Shared ReadWriteMany NFS volume so both replicas share uploads + model
      # caches. The database no longer lives on this volume (it is in Postgres).
      # Note: the storage class cannot be changed on an existing PVC — the old
      # truenas-iscsi PVC must be deleted (after copying uploads + cache) so the
      # chart provisions a fresh truenas-nfs PVC. See README.
      accessModes:
        - ReadWriteMany
      enabled: true
      size: 10Gi
      storageClass: truenas-nfs
    ingress:
      enabled: false
    workload:
      # Deployment instead of StatefulSet: the app is now stateless (all state
      # lives in Postgres + the shared NFS volume), so replicas are interchangeable.
      kind: Deployment
    replicaCount: 2
    revisionHistoryLimit: 10
    resources:
      limits:
        cpu: "4"
        memory: 4G
      requests:
        cpu: "0.1"
        memory: 100m
    service:
      type: ClusterIP
      port: 80
      containerPort: 8080
