---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
      version: "17.4.0"
  interval: 1h
  values:
    image:
      pullPolicy: Always
      repository: ghcr.io/open-webui/open-webui
      tag: v0.12.3
    ollama:
      enabled: false
    ollamaUrlsFromExtraEnv: false
    openaiBaseApiUrl: https://litellm.garage.neo-tix.com/v1
    openaiApiKeyExistingSecret: open-webui
    openaiApiKeyExistingSecretKey: openai-api-key
    pipelines:
      enabled: false
    tika:
      enabled: false
    websocket:
      enabled: false
      manager: redis
    extraEnvVars:
      - name: WEBUI_URL
        value: https://chat.garage.neo-tix.com
      - name: PLAYWRIGHT_WS_URI
        value: ws://playwright.playwright.svc.cluster.local:9222
      - name: TOKENIZERS_PARALLELISM
        value: "true"
    persistence:
      accessModes:
        - ReadWriteOnce
      enabled: true
      size: 8Gi
      storageClass: truenas-iscsi
    ingress:
      enabled: false
    replicaCount: 1
    revisionHistoryLimit: 10
    resources:
      limits:
        cpu: "4"
        memory: 4G
      requests:
        cpu: "0.1"
        memory: 100m
    service:
      type: ClusterIP
      port: 80
      containerPort: 8080
