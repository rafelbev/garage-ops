---
# Static PersistentVolumeClaim for Gonic media library
# Binds to the shared TrueNAS media NFS export
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gonic-media
  namespace: gonic
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 4Ti
  volumeName: gonic-media-pv
