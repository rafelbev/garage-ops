---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gonic
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: gonic
      namespace: gonic
  interval: 1h
  path: ./kubernetes/apps/gonic/gonic/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: gonic
