---
# The Kubernetes API server VIP (172.20.17.138:6443) — the node-network L4
# load balancer in front of the three control-plane kube-apiservers.
#
# kubectl authenticates with a **client certificate** (mTLS). Envoy must NOT
# terminate that TLS: a terminated HTTPS route (HTTPRoute) drops the client
# cert, so kube-apiserver answers "the server has asked for the client to
# provide credentials". Instead the gateway does raw TLS **passthrough** — it
# routes on SNI and forwards the still-encrypted bytes (client cert intact) to
# the VIP. That needs a Service+Endpoints static endpoint (headscale /
# hermes-dashboard pattern) referenced by a TLSRoute, plus a TLS listener in
# Passthrough mode on the envoy-external Gateway (see
# kubernetes/apps/network/envoy-gateway/app/envoy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: k8s-api
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 6443
      targetPort: 6443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: k8s-api
subsets:
  - addresses:
      - ip: 172.20.17.138
    ports:
      - name: api
        port: 6443
        protocol: TCP
---
# v1alpha2 on purpose: the k8s-gateway coreDNS plugin (k8s_gateway 1.7.0)
# resolves TLSRoute at gateway.networking.k8s.io/v1alpha2. A v1 TLSRoute would
# route fine in Envoy but the plugin would ignore it, silently dropping the
# internal A record for k8s.garage.neo-tix.com.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: k8s-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: k8s-tls
  hostnames:
    - k8s.garage.neo-tix.com
  rules:
    - backendRefs:
        - name: k8s-api
          port: 6443
