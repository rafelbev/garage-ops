---
# Allow the HTTPRoute in the network namespace to reference the
# music-assistant Service in the music-assistant namespace (cross-namespace backend
# reference).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: sendspin-auth-ref
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: network
  to:
    - group: ""
      kind: Service
      name: music-assistant
