---
# Static PersistentVolume for Music Assistant data
# Points to existing TrueNAS NFS export with media library
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-assistant-media-pv
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 172.20.17.150
    path: /mnt/storage/media
  mountOptions:
    - hard
    - nfsvers=4
    - sync
    - noac
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
