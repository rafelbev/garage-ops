---
# Static PersistentVolumeClaim for Music Assistant data
# Binds to the shared TrueNAS media NFS export
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-data
  namespace: music-assistant
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 4Ti
  volumeName: music-assistant-media-pv
