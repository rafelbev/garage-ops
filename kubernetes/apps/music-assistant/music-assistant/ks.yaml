---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: music-assistant
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: music-assistant
      namespace: music-assistant
  interval: 1h
  path: ./kubernetes/apps/music-assistant/music-assistant/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: music-assistant
