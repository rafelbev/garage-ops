---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netshoot
spec:
  interval: 1h
  path: ./kubernetes/apps/troubleshooting/netshoot/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: troubleshooting
  wait: false
