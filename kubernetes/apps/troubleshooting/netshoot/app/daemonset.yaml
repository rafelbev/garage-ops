---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netshoot
  namespace: troubleshooting
  labels:
    app: netshoot
spec:
  selector:
    matchLabels:
      app: netshoot
  template:
    metadata:
      annotations:
        # Attach a secondary interface on the trunk NIC for each VLAN (Multus).
        # eth0 = Cilium (default), eth1 = macvlan on trunk0.20, eth2 = macvlan on trunk0.40.
        k8s.v1.cni.cncf.io/networks: vlan-20,vlan-40
      labels:
        app: netshoot
    spec:
      containers:
        - name: netshoot
          image: docker.io/nicolaka/netshoot:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 5
