---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kuberhealthy
spec:
  interval: 1h
  path: ./kubernetes/apps/kuberhealthy/kuberhealthy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kuberhealthy
  wait: true
