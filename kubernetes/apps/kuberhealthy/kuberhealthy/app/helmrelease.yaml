---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberhealthy
spec:
  chart:
    spec:
      chart: kuberhealthy
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: kuberhealthy
  interval: 1h
  values:
    # Two replicas so the alerting pipeline survives a single node dying:
    # pods on a dead node are not rescheduled until the node object is
    # deleted, so with one replica the entire Kubehealthy (checks +
    # metrics) goes silent with the node, as happened on cluster-6 on
    # 2026-11-18. Kubehealthy uses leader election, so a second instance
    # is safe; the chart's default hard pod anti-affinity keeps the two
    # replicas on different nodes.
    deployment:
      replicas: 2
      # Scope the operator to this namespace so it only reconciles
      # HealthChecks here.
      env:
        KH_TARGET_NAMESPACE: kuberhealthy
      # We scrape via a static Prometheus scrape config, not annotations.
      prometheusScrape:
        enabled: false
    # The checker pods run a plain curl image; the chart's strict
    # securityContext (runAsUser 999 + read-only rootfs) would be applied to
    # every check pod and is not needed for a stateless curl probe.
    securityContext:
      enabled: false
    # Do not expose the operator's UI/metrics outside the cluster.
    service:
      type: ClusterIP
      prometheusScrape:
        enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
