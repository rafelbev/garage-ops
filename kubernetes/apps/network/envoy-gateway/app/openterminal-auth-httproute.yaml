apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openterminal-auth
  namespace: network
spec:
  hostnames:
    - openterminal.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: openterminal
          namespace: openterminal
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
