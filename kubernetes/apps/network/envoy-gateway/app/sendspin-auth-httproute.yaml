apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sendspin-auth
  namespace: network
spec:
  hostnames:
    - sendspin.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: music-assistant
          namespace: music-assistant
          port: 8927
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
