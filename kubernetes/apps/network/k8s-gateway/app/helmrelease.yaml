---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "172.20.17.136"
      externalTrafficPolicy: Cluster
    # TLSRoute added so the plugin resolves the k8s-api passthrough route
    # (k8s.garage.neo-tix.com). k8s_gateway 1.7.0 watches it at v1alpha2.
    watchedResources: ["HTTPRoute", "Service", "TLSRoute"]
