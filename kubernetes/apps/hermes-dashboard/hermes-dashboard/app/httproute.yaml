---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
  namespace: hermes-dashboard
spec:
  hostnames:
    - hermes-dashboard.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: hermes-dashboard
          namespace: hermes-dashboard
          port: 9119
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
