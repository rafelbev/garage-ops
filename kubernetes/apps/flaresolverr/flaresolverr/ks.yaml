---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flaresolverr
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: flaresolverr
      namespace: flaresolverr
  interval: 1h
  path: ./kubernetes/apps/flaresolverr/flaresolverr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flaresolverr
