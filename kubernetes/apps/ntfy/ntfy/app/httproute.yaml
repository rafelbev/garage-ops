---
# ntfy — ntfy.cloud.neo-tix.com (k3s) -> ntfy.garage.neo-tix.com (Talos).
#
# Host-endpoint (exposure-only) migration: ntfy is a host process on
# 172.20.17.17:8084, so only the cluster-side exposure moves to Talos. The
# two-level wildcard cert (certificate.yaml) and the wildcard public A record
# (public-dns) already cover *.garage.neo-tix.com, so no per-app Certificate
# or DNSEndpoint is needed — just the selectorless Service, the manual
# Endpoints, and this HTTPRoute on the envoy-external gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
spec:
  hostnames:
    - ntfy.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ntfy
          namespace: ntfy
          port: 8084
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
