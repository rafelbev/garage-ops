---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: authelia
      namespace: authelia
  interval: 1h
  path: ./kubernetes/apps/authelia/authelia/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: authelia
