---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lidarr
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: lidarr
      namespace: lidarr
  interval: 1h
  path: ./kubernetes/apps/lidarr/lidarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: lidarr
