---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: radarr
      namespace: radarr
  interval: 1h
  path: ./kubernetes/apps/radarr/radarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: radarr
