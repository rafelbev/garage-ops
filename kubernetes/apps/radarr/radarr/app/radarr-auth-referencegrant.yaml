---
# Allow the HTTPRoute in the network namespace to reference the
# radarr Service in the radarr namespace (cross-namespace backend
# reference).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: radarr-auth-ref
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: network
  to:
    - group: ""
      kind: Service
      name: radarr
