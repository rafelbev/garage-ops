---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  hostnames:
    - headscale.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: headplane
          namespace: headscale
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /admin/
    - backendRefs:
        - group: ""
          kind: Service
          name: headscale
          namespace: headscale
          port: 8085
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
