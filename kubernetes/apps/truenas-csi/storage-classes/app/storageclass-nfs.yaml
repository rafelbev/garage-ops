---
# NFS StorageClass - ReadWriteMany (RWX) support
# Best for: shared volumes, multiple readers, home directory storage
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  datasetPath: "k8s/nfs"
  compression: "LZ4"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
