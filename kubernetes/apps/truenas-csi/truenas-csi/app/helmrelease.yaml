---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
spec:
  chart:
    spec:
      chart: truenas-csi
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
      version: "1.3.0"
  interval: 1h
  values:
    truenas:
      url: wss://fileserver.intranet.neo-tix.com:444/api/current
      defaultPool: storage
      insecureSkipTLS: true
      # API key is injected from the sops secret via existingSecret
      existingSecret: truenas-csi-secret
      existingSecretKey: api-key
      nfsServer: fileserver.intranet.neo-tix.com
      iscsiPortal: 172.20.17.17:3260
      iscsiIQNBase: iqn.2005-10.org.freenas.ctl
    driverName: csi.truenas.io
    logLevel: 4
    controller:
      replicas: 1
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
          cpu: 200m
    node:
      privileged: true
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
          cpu: 200m
    storageClasses:
      - name: truenas-iscsi
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions: []
        parameters:
          protocol: iscsi
      - name: truenas-nfs
        isDefault: false
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions: []
        parameters:
          protocol: nfs
  # The truenas-csi chart hardcodes the iscsi-dir hostPath as type "Directory".
  # On Talos, /etc/iscsi is created late by the ext-iscsid system container;
  # a strict "Directory" check fails the hostPath type check and the CSI node
  # pod gets stuck in ContainerCreating (reproducible after a node reset).
  # "DirectoryOrCreate" matches the sibling iscsi-lib volume in the same chart
  # and lets the pod start as soon as the directory appears.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: truenas-csi-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: truenas-csi-node
              spec:
                template:
                  spec:
                    volumes:
                      - name: iscsi-dir
                        hostPath:
                          path: /etc/iscsi
                          type: DirectoryOrCreate
