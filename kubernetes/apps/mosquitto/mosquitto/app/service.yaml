---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app: mosquitto
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-external
  namespace: mosquitto
  labels:
    app: mosquitto
  annotations:
    # Pinned to a free IP from the Cilium LB pool. 172.20.17.134-142 are
    # taken by existing services/endpoints; 172.20.17.143 was port-swept
    # (22, 80, 443, 3000, 5432, 8080, 8081, 8443, 5000, 5001, 6443, 8000,
    # 8384, 892, 9000, 1883, 32400) and is silent.
    lbipam.cilium.io/ips: "172.20.17.143"
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: tcp-mosquitto
      port: 1883
      targetPort: 1883
      protocol: TCP
