---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: tika
  labels:
    app: tika
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      restartPolicy: Always
      containers:
        - name: tika
          image: apache/tika:4.2.0-1-full
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9998
              name: http
          env:
            - name: TZ
              value: "Europe/Malta"
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
