---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tika
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tika
      namespace: tika
  interval: 1h
  path: ./kubernetes/apps/tika/tika/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tika
