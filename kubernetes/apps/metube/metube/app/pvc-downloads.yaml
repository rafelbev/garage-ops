---
# Static PersistentVolumeClaim for Metube downloads
# Binds to the shared TrueNAS media NFS export
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metube-downloads
  namespace: metube
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 4Ti
  volumeName: metube-media-pv
