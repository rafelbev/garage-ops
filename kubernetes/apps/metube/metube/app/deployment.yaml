---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
  labels:
    app: metube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      securityContext:
        fsGroup: 568
        supplementalGroups:
          - 568
      restartPolicy: Always
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.08.28
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: TZ
              value: "Europe/Malta"
            - name: UMASK
              value: "0022"
            - name: UMASK_SET
              value: "0022"
            - name: S6_READ_ONLY_ROOT
              value: "1"
            - name: DOWNLOAD_DIR
              value: /downloads
            - name: OUTPUT_TEMPLATE
              value: "%(title)s.%(ext)s"
            - name: STATE_DIR
              value: /config
            - name: YTDL_OPTIONS
              value: "{}"
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: config
              mountPath: /config
            - name: devshm
              mountPath: /dev/shm
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
            - name: varlogs
              mountPath: /var/logs
            - name: varrun
              mountPath: /var/run
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
        - name: config
          persistentVolumeClaim:
            claimName: metube-config
        - name: devshm
          emptyDir:
            medium: Memory
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: varlogs
          emptyDir: {}
        - name: varrun
          emptyDir:
            medium: Memory
