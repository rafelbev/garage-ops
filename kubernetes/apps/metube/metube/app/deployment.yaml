---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  namespace: metube
  labels:
    app: metube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
    spec:
      restartPolicy: Always
      serviceAccountName: default
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
      initContainers:
        - name: fix-ownership
          image: ghcr.io/alexta69/metube:2026.10.19
          command:
            - /bin/sh
            - -c
            - "chown -R 568:568 /config; [ -d /downloads/.metube ] && chown -R 568:568 /downloads/.metube; true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:2026.10.19
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Malta"
            - name: UMASK
              value: "0022"
            - name: UMASK_SET
              value: "0022"
            - name: S6_READ_ONLY_ROOT
              value: "1"
            - name: DOWNLOAD_DIR
              value: /downloads
            - name: OUTPUT_TEMPLATE
              value: "%(title)s.%(ext)s"
            - name: STATE_DIR
              value: /config
            - name: YTDL_OPTIONS
              value: "{}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 8Gi
              cpu: "4"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 600
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
            successThreshold: 2
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: devshm
              mountPath: /dev/shm
            - name: downloads
              mountPath: /downloads
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
            - name: varlogs
              mountPath: /var/logs
            - name: varrun
              mountPath: /var/run
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: metube-config
        - name: devshm
          emptyDir:
            medium: Memory
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: varlogs
          emptyDir: {}
        - name: varrun
          emptyDir:
            medium: Memory
