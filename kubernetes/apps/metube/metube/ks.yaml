---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metube
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: metube
      namespace: metube
  interval: 1h
  path: ./kubernetes/apps/metube/metube/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: metube
