apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chart:
    spec:
      chart: kritika
      sourceRef:
        kind: HelmRepository
        name: kritika
      version: "0.0.121"
  interval: 1h
  values:
    config:
      webUrl: https://kritika.garage.neo-tix.com
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      apps:
        github:
          accounts:
            - rafelbev
          clientId: "Iv23likTMmxMKyTeBZY9"
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
          apiKey:
            env: LITELLM_API_KEY
          timeout: 15m
        # Direct LocalAI API for the embedding model. The LocalAI server at
        # 172.20.17.130:8000 serves granite-embedding-125m-english natively
        # with a larger batch size than the LiteLLM-routed path. No auth is
        # required; LOCALAI_API_KEY is a placeholder env var.
        localai:
          type: openai
          baseUrl: https://local-ai.garage.neo-tix.com/v1
          apiKey:
            env: LOCALAI_API_KEY
          timeout: 15m
      # Review model: <provider>/<model>. The `litellm` provider is the
      # in-cluster LiteLLM gateway (see providers.litellm above); the model
      # id is what the gateway serves (verified via /v1/models).
      review:
        model: "litellm/garage/qwen3.8:27B"
      # Embedder for similar-code indexing. Uses the LocalAI API directly
      # (172.20.17.130:8000) which serves granite-embedding-125m-english
      # natively with a larger batch size. dims must match the model's
      # output dimension (768 for Granite-Embedding-125m-English).
      embedding:
        model: "localai/granite-embedding-125m-english"
        dims: 768
    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
        role: kritika_app
    envFrom:
      - secretRef:
          name: kritika-credentials
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-external
          namespace: network
      hostnames:
        - kritika.garage.neo-tix.com
    networkPolicy:
      extraEgress:
        - to:
            - ipBlock:
                cidr: 172.20.17.150/32
          ports:
            - port: 5432
              protocol: TCP
        - to:
            - ipBlock:
                cidr: 172.20.17.137/32
          ports:
            - port: 443
              protocol: TCP
