apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chart:
    spec:
      chart: kritika
      sourceRef:
        kind: HelmRepository
        name: kritika
      version: "0.0.121"
  interval: 1h
  values:
    config:
      webUrl: https://kritika.garage.neo-tix.com
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      apps:
        github:
          accounts:
            - rafelbev
          clientId: "Iv23likTMmxMKyTeBZY9"
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
          apiKey:
            env: LITELLM_API_KEY
      # Review model: <provider>/<model>. The `litellm` provider is the
      # in-cluster LiteLLM gateway (see providers.litellm above); the model
      # id is what the gateway serves (verified via /v1/models).
      review:
        model: "litellm/garage/qwen3.8:27B"
      # Embedder for similar-code indexing. Uses the same LiteLLM gateway
      # provider; the model id is what the gateway serves (verified via
      # /v1/models). dims must match the model's output dimension.
      embedding:
        model: "litellm/garage/granite-embedding"
        dims: 768
    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
        role: kritika_app
    envFrom:
      - secretRef:
          name: kritika-credentials
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-external
          namespace: network
      hostnames:
        - kritika.garage.neo-tix.com
    networkPolicy:
      extraEgress:
        - to:
            - ipBlock:
                cidr: 172.20.17.150/32
          ports:
            - port: 5432
              protocol: TCP
