---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      restartPolicy: Always
      containers:
        - name: whisper
          image: rhasspy/wyoming-whisper:3.8.1
          imagePullPolicy: IfNotPresent
          args:
            - --debug
            - --model
            - Systran/faster-distil-whisper-small.en
            - --language
            - en
          env:
            - name: TZ
              value: "Europe/Malta"
          ports:
            - name: wyoming
              containerPort: 10300
              protocol: TCP
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: "2"
          # Model load takes a while; give startup 2.5 min before liveness kicks in.
          startupProbe:
            tcpSocket:
              port: 10300
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 10300
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10300
            periodSeconds: 10
            failureThreshold: 3
