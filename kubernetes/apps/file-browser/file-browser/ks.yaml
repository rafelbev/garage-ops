---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: file-browser
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: file-browser
      namespace: file-browser
  interval: 1h
  path: ./kubernetes/apps/file-browser/file-browser/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: file-browser
