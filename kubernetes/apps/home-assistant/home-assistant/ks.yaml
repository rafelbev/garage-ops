---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: home-assistant
      namespace: home-assistant
  interval: 1h
  path: ./kubernetes/apps/home-assistant/home-assistant/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-assistant
