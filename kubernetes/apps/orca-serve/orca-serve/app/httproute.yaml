---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orca-serve
  namespace: orca-serve
spec:
  hostnames:
    - orca.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: orca-service
          namespace: orca-serve
          port: 6768
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
