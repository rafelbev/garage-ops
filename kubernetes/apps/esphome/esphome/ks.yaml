---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: esphome
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: esphome
      namespace: esphome
  interval: 1h
  path: ./kubernetes/apps/esphome/esphome/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: esphome
