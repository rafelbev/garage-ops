---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ghostfolio
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ghostfolio
      namespace: ghostfolio
  interval: 1h
  path: ./kubernetes/apps/ghostfolio/ghostfolio/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ghostfolio
