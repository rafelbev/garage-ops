---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: forgejo
      namespace: forgejo
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
