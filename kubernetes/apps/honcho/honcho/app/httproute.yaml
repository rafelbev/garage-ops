---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honcho
  namespace: honcho
spec:
  hostnames:
    - honcho.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: honcho
          namespace: honcho
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
