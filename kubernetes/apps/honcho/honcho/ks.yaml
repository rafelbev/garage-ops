---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: honcho
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: honcho
      namespace: honcho
  interval: 1h
  path: ./kubernetes/apps/honcho/honcho/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: honcho
