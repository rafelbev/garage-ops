---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audiobookshelf
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: audiobookshelf
      namespace: audiobookshelf
  interval: 1h
  path: ./kubernetes/apps/audiobookshelf/audiobookshelf/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: audiobookshelf
