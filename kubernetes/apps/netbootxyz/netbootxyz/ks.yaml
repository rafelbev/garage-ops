---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbootxyz
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: netbootxyz
      namespace: netbootxyz
  interval: 1h
  path: ./kubernetes/apps/netbootxyz/netbootxyz/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: netbootxyz
