---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phpipam
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: phpipam
      namespace: phpipam
  interval: 1h
  path: ./kubernetes/apps/phpipam/phpipam/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: phpipam
