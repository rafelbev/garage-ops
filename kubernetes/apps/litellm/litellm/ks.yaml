---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: litellm
      namespace: litellm
  interval: 1h
  path: ./kubernetes/apps/litellm/litellm/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: litellm
