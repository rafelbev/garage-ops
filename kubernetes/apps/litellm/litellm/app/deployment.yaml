---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      restartPolicy: Always
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.106.6
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/proxy_server_config.yaml
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: TZ
              value: "Europe/Malta"
          envFrom:
            - secretRef:
                name: litellm
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "2"
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: litellm-config
            defaultMode: 420
