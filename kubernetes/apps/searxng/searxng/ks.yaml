---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: searxng
      namespace: searxng
  interval: 1h
  path: ./kubernetes/apps/searxng/searxng/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: searxng
