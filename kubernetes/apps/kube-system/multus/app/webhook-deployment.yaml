---
# Mutating webhook that injects a random MAC into each pod's
# `k8s.v1.cni.cncf.io/networks` annotation (for Multus + the `dhcp` CNI IPAM
# plugin). See webhook/main.go for the implementation.
#
# The webhook only acts on pods that carry the annotation with a `mac`
# placeholder; it generates a random locally-administered unicast MAC (02:xx:xx:
# xx:xx:xx) per network entry and replaces the placeholder. The DHCP server
# then assigns each pod a random IP keyed by that MAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mac-webhook
  namespace: kube-system
  labels:
    app: mac-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mac-webhook
  template:
    metadata:
      labels:
        app: mac-webhook
    spec:
      containers:
        - name: mac-webhook
          # Built from webhook/Dockerfile; push to your registry and update the
          # tag here.
          image: ghcr.io/rafelbev/mac-webhook:latest
          ports:
            - name: webhook
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: mac-webhook-tls
            defaultMode: 0400
