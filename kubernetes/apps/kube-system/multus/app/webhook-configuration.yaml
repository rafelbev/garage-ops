---
# MutatingWebhookConfiguration that registers the mac-webhook. It intercepts
# pod CREATE operations and calls the webhook to inject a random MAC into the
# pod's `k8s.v1.cni.cncf.io/networks` annotation.
#
# The `caBundle` MUST be set to the base64-encoded CA cert from the
# `mac-webhook-tls` secret (issued by cert-manager). Run
# `webhook-cabundle-update.sh` (below) after the Certificate is ready to set it.
# Until the `caBundle` is set, the webhook is inactive (pods are not mutated).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mac-webhook
webhooks:
  - name: mac-webhook.neo-tix.com
    clientConfig:
      service:
        namespace: kube-system
        name: mac-webhook
        path: /mutate
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    # If the webhook is unavailable, do not block pod creation (fail open).
    failurePolicy: Ignore
    sideEffects: None
    admissionReviewVersions: ["v1"]
    timeoutSeconds: 5
    # Set by webhook-cabundle-update.sh after the Certificate is issued.
    caBundle: ""
