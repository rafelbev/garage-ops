---
# Per-node DHCP daemon for the `dhcp` CNI IPAM plugin. The dhcp plugin talks to
# this daemon over a unix socket (/run/cni/dhcp.sock) to request and renew DHCP
# leases for each pod's secondary interface. The daemon must be running on every
# node that uses a dhcp-IPAM NetworkAttachmentDefinition.
#
# The `dhcp` and `macvlan` CNI binaries are NOT in the Multus thick image. The
# init container below downloads them from the containernetworking/plugins
# release (which bundles both binaries) and installs them to /opt/cni/bin on
# the host (via hostPath). It skips the download if both binaries are already
# present, so a pod recreation does not re-fetch them.
#
# The socket path /run/cni/dhcp.sock must match `daemonSocketPath` in the NADs
# (kubernetes/apps/kube-system/multus/app/nads.yaml).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dhcp-daemon
  namespace: kube-system
  labels:
    tier: node
    app: dhcp-daemon
    name: dhcp-daemon
spec:
  selector:
    matchLabels:
      name: dhcp-daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: dhcp-daemon
        name: dhcp-daemon
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      priorityClassName: system-node-critical
      initContainers:
        - name: install-dhcp-binary
          image: docker.io/library/alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              VERSION=v1.9.1
              URL="https://github.com/containernetworking/plugins/releases/download/${VERSION}/cni-plugins-linux-amd64-${VERSION}.tgz"
              if [ -x /opt/cni/bin/dhcp ] && [ -x /opt/cni/bin/macvlan ]; then
                echo "dhcp and macvlan binaries already present — skipping download"
                exit 0
              fi
              echo "Downloading ${URL} ..."
              wget -q -O /tmp/cni-plugins.tgz "${URL}"
              tar -xzf /tmp/cni-plugins.tgz -C /tmp ./dhcp ./macvlan
              install -m 0755 /tmp/dhcp /opt/cni/bin/dhcp
              install -m 0755 /tmp/macvlan /opt/cni/bin/macvlan
              echo "Installed /opt/cni/bin/dhcp and /opt/cni/bin/macvlan"
          volumeMounts:
            - name: cnibin
              mountPath: /opt/cni/bin
      containers:
        - name: dhcp
          image: docker.io/library/busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              rm -f /run/cni/dhcp.sock
              mkdir -p /run/cni
              /opt/cni/bin/dhcp daemon -pidfile /run/cni/dhcp.pid -hostprefix /host
          securityContext:
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cnibin
              mountPath: /opt/cni/bin
            - name: host-run
              mountPath: /run
            - name: hostroot
              mountPath: /host
              mountPropagation: HostToContainer
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
        - name: host-run
          hostPath:
            path: /run
            mountPropagation: HostToContainer
        - name: hostroot
          hostPath:
            path: /
