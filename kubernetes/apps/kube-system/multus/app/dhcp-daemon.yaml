---
# Per-node DHCP daemon for the `dhcp` CNI IPAM plugin. The dhcp plugin talks to
# this daemon over a unix socket (/run/cni/dhcp.sock) to request and renew DHCP
# leases for each pod's secondary interface. The daemon must be running on every
# node that uses a dhcp-IPAM NetworkAttachmentDefinition.
#
# The `dhcp` binary lives in /opt/cni/bin on the host (installed by the Talos
# SystemExtension — see talos/ and the README). This DaemonSet runs the host's
# `dhcp` binary in daemon mode; the container image is just a shell to execute it.
#
# The socket path /run/cni/dhcp.sock must match `daemonSocketPath` in the NADs
# (kubernetes/apps/kube-system/multus/app/nads.yaml).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dhcp-daemon
  namespace: kube-system
  labels:
    tier: node
    app: dhcp-daemon
    name: dhcp-daemon
spec:
  selector:
    matchLabels:
      name: dhcp-daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: dhcp-daemon
        name: dhcp-daemon
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      priorityClassName: system-node-critical
      containers:
        - name: dhcp
          image: docker.io/library/busybox:latest
          command:
            - /opt/cni/bin/dhcp
            - daemon
            - -pidfile
            - /run/cni/dhcp.pid
            - -hostprefix
            - /host
          securityContext:
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cnibin
              mountPath: /opt/cni/bin
            - name: host-run
              mountPath: /run
            - name: hostroot
              mountPath: /host
              mountPropagation: HostToContainer
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
        - name: host-run
          hostPath:
            path: /run
        - name: hostroot
          hostPath:
            path: /
