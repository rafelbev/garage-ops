---
# Secondary (multi-homed) networks on the trunk NIC. Each NAD attaches a
# `bridge` CNI interface to the Talos L2 bridge (br-vlan<id>) that sits on the
# matching 802.1Q VLAN sub-interface (trunk0.<id>). Pods opt in via:
#   metadata.annotations["k8s.v1.cni.cncf.io/networks"] = "kube-system/vlan-20"
#
# The `bridge` CNI (bundled in the Multus thick image) is used instead of
# `macvlan` (not bundled) — see the official Sidero Talos Multus guide.
#
# IPAM is DHCP: the pod's interface gets its IP (and netmask) from the DHCP
# server on that VLAN, keyed by the interface's MAC. `capabilities.mac` lets
# each pod pin its MAC via the annotation (`{"name": ..., "mac": "..."}`), so
# the DHCP server can map a known MAC to a known IP (deterministic, no
# cross-node coordination, no duplicate IPs). See the README for the MAC
# scheme and the dhcp daemon / SystemExtension that back this.
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-20
spec:
  config: |-
    {
        "cniVersion": "0.3.1",
        "name": "vlan-20",
        "type": "bridge",
        "bridge": "br-vlan20",
        "capabilities": { "mac": true },
        "ipam": {
            "type": "dhcp",
            "daemonSocketPath": "/run/cni/dhcp.sock"
        }
    }
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-40
spec:
  config: |-
    {
        "cniVersion": "0.3.1",
        "name": "vlan-40",
        "type": "bridge",
        "bridge": "br-vlan40",
        "capabilities": { "mac": true },
        "ipam": {
            "type": "dhcp",
            "daemonSocketPath": "/run/cni/dhcp.sock"
        }
    }
