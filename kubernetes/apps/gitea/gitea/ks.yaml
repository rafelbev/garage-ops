---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: gitea
      namespace: gitea
  interval: 1h
  path: ./kubernetes/apps/gitea/gitea/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: gitea
