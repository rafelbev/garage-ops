apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-server
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
  interval: 1h
  path: ./kubernetes/apps/immich/immich/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: immich
