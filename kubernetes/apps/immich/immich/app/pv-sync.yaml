---
# Static PersistentVolume for the immich sync folder
# Points to the existing TrueNAS NFS export already used by k3s
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-sync-pv
spec:
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 172.20.17.150
    path: /mnt/storage/media/Documents/Sync
  mountOptions:
    - hard
    - nfsvers=4
    - sync
    - noac
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
