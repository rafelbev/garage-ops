apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/name: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.3.5
          ports:
            - containerPort: 2283
              name: http
          env:
            # The database stays on the k3s cluster (no in-cluster database on
            # Talos): CNPG cluster `immich` in k3s namespace `immich`,
            # primary exposed via the `immich-postgres-external` NodePort
            # service (5432 -> 32289) reachable on k3s node 172.20.0.113
            # (k3os-8974). Same user/database as on k3s; password comes from
            # the sops-encrypted `immich-db` secret.
            - name: DB_HOSTNAME
              value: 172.20.0.113
            - name: DB_PORT
              value: "32289"
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: db_password
            # Redis is hosted on redis.intranet.neo-tix.com (172.20.17.17)
            # as a standalone Docker Redis (migrated from the k3s `redis`
            # namespace; same password, AOF enabled). The intranet DNS name
            # does not resolve inside the cluster, so the IP is used.
            # The password is unchanged, so the existing `immich-redis`
            # secret continues to work.
            - name: REDIS_HOSTNAME
              value: 172.20.17.17
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-redis
                  key: password
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: TZ
              value: Europe/Malta
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
            - name: documents
              mountPath: /documents
              readOnly: true
            - name: sync
              mountPath: /sync
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: media-pvc
        - name: documents
          persistentVolumeClaim:
            claimName: documents-pvc
        - name: sync
          persistentVolumeClaim:
            claimName: sync-pvc
