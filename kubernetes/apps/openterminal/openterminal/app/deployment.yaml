---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openterminal
  labels:
    app: openterminal
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: openterminal
  # Recreate (not RollingUpdate): the pod uses a ReadWriteOnce iSCSI PVC,
  # which cannot be attached to the new pod while the old pod still has
  # it. RollingUpdate would deadlock the rollout in ContainerCreating.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openterminal
    spec:
      containers:
        - name: open-terminal
          image: ghcr.io/open-webui/open-terminal:0.14.5
          imagePullPolicy: Always
          env:
            - name: OPEN_TERMINAL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: openterminal-secret
          ports:
            - containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - mountPath: /home/user
              name: data-volume
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: open-terminal-pvc
