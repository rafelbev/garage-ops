---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openterminal
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: openterminal
      namespace: openterminal
  interval: 1h
  path: ./kubernetes/apps/openterminal/openterminal/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: openterminal
