---
# Public DNS for the Minecraft Bedrock server — dedicated IP exposure.
#
# The minecraft-bedrock Service is a LoadBalancer pinned to 172.20.17.140
# (Cilium LoadBalancerIPAM). Players connect straight to that IP:
#   - TCP 19132        (NetherNet HTTP signaling handshake)
#   - UDP 19140-19155  (per-client gameplay ports)
#
# Both records are GREY (unproxied) — `cloudflare/proxied: "false"` — because
# Cloudflare's proxy does not forward UDP for a standard DNS record, so a
# proxied (orange) A record would break the UDP gameplay ports. (The TLS-at-the-
# CF-edge concern that keeps the HTTP apps grey is irrelevant here: this is a
# raw game-server endpoint, not HTTPS.)
#
#   A      minecraft-server.garage.neo-tix.com -> 172.20.17.140
#   CNAME  toe-smp.garage.neo-tix.com          -> minecraft-server.garage.neo-tix.com
#
# Synced to the Cloudflare zone by external-dns (cloudflare-dns, `crd` source),
# which watches DNSEndpoint resources across all namespaces.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: minecraft-bedrock
spec:
  endpoints:
    - dnsName: "minecraft-server.${SECRET_DOMAIN}"
      recordType: A
      recordTTL: 300
      targets: ["172.20.17.140"]
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: "toe-smp.${SECRET_DOMAIN}"
      recordType: CNAME
      recordTTL: 300
      targets: ["minecraft-server.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
