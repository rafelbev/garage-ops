---
# Public DNS for the Minecraft Bedrock server — split-horizon, public side.
#
# This is a SPLIT-HORIZON record:
#   - Internal (172.20.17.136, k8s-gateway): resolves to the dedicated LB IP
#     172.20.17.140. That is served by the `coredns.io/hostname` annotation on
#     the minecraft-bedrock Service (see service.yaml) — NOT by this DNSEndpoint.
#   - Public (Cloudflare): resolves to the cluster's public IP, the same as the
#     rest of the garage records.
#
# Only a CNAME is defined here. The A record is deliberately NOT defined:
#   - minecraft-server.garage.neo-tix.com is served by the
#     *.garage.neo-tix.com wildcard (network/public-dns), which the
#     public-dns-updater CronJob keeps pointed at the current WAN IP.
#   - toe-smp.garage.neo-tix.com is a CNAME to minecraft-server, so it chains
#     through the wildcard to the same public IP.
#
# Defining no explicit A record means the public answer tracks the WAN IP
# automatically, exactly like every other garage record.
#
# The CNAME is GREY (unproxied) — `cloudflare/proxied: "false"` — so the
# resolution chain is served directly by the upstream (the wildcard A record)
# rather than being terminated at the Cloudflare edge. (Bedrock gameplay uses
# raw TCP/UDP to the IP, not HTTPS through the CF proxy, so the TLS-at-the-edge
# concern that keeps the HTTP apps grey does not apply, and the CNAME must not
# be proxied either.)
#
# Synced to the Cloudflare zone by external-dns (cloudflare-dns, `crd` source),
# which watches DNSEndpoint resources across all namespaces.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: minecraft-bedrock
spec:
  endpoints:
    - dnsName: "toe-smp.${SECRET_DOMAIN}"
      recordType: CNAME
      recordTTL: 300
      targets: ["minecraft-server.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
