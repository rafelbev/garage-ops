---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: readarr
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: readarr
      namespace: readarr
  interval: 1h
  path: ./kubernetes/apps/readarr/readarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: readarr
