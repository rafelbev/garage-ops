---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-address-book
spec:
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.1"
  interval: 1h
  values:
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: github-runners
    runnerScaleSetName: address-book
    githubConfigUrl: https://github.com/rafelbev/address-book
    githubConfigSecret: gha-credentials
    minRunners: 0
    maxRunners: 2
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.0
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 8Gi
