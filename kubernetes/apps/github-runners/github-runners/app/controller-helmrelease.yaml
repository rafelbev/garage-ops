---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
spec:
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set-controller
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.1"
  interval: 1h
  values:
    env:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gha-credentials
            key: github_token
