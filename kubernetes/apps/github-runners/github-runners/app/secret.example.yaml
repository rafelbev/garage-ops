#   sops --encrypt --in-place secret.sops.yaml
#   git add secret.sops.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: gha-credentials
  namespace: github-runners
type: Opaque
stringData:
  github_token: REPLACE-WITH-GITHUB-TOKEN
