---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-localai-beellama-backend
spec:
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.1"
  interval: 1h
  values:
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: github-runners
    runnerScaleSetName: localai-beellama-backend
    githubConfigUrl: https://github.com/rafelbev/localai-beellama-backend
    githubConfigSecret: gha-credentials
    minRunners: 0
    maxRunners: 2
    # dind mode: the backend repo's CI builds + pushes a container image
    # on these runners, so the runner pod needs a docker daemon. The chart
    # adds a dind sidecar + init containers and wires DOCKER_HOST into the
    # runner container (the template below is merged with the dind pod spec).
    containerMode:
      type: dind
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 8Gi
