---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-localai-beellama-backend
spec:
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.1"
  interval: 1h
  values:
    # No containerMode set: the chart defaults to "none", so it uses the
    # explicit containers below (our dind sidecar + runner) instead of
    # injecting its own dind sidecar.
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: github-runners
    runnerScaleSetName: localai-beellama-backend
    githubConfigUrl: https://github.com/rafelbev/localai-beellama-backend
    githubConfigSecret: gha-credentials
    minRunners: 0
    maxRunners: 2
    # No containerMode: the chart defaults to "none", so it uses the
    # explicit containers below (our dind sidecar + runner) as-is.
    # (containerMode: dind would override our dind container's volumeMounts
    # with the chart's fixed set, dropping the dind-data mount that dockerd
    # needs for /var/lib/docker.)
    template:
      spec:
        containers:
          # Docker sidecar: runs dockerd in the same Pod; the runner talks to it
          # over the shared socket instead of spawning its own dockerd.
          # DOCKER_TLS_CERTDIR="" disables TLS (and the TCP listener) so the
          # daemon is only reachable over the unix socket, which is what the
          # runner uses via DOCKER_HOST.
          #
          # /var/lib/docker MUST be a volume mount (emptyDir): the container
          # rootfs is overlayfs, and nested overlayfs mounts don't work —
          # dockerd needs a real filesystem for its image storage.
          # See: https://github.com/siderolabs/talos/discussions/8936
          - name: dind
            image: docker:29-dind
            command:
              - dockerd-entrypoint.sh
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: TEST_DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: DOCKER_BUILDKIT
                value: "1"
              - name: DOCKER_GIT_REF
                value: v27.5.1
              - name: DOCKER_TLS_CERTDIR
                value: ""
            volumeMounts:
              - name: dind-sock
                mountPath: /var/run
              - name: dind-data
                mountPath: /var/lib/docker
          # sock-fix opens up the docker socket for the unprivileged runner
          # user. The actions-runner image runs as uid 1001 (`runner`), but
          # dockerd creates the socket as root:2375 mode 660, so the runner
          # gets "permission denied" connecting to it. This sidecar waits for
          # the socket to appear, then chmods it 666 so the runner can use it.
          # (It runs in parallel with dind; the loop is a no-op once the socket
          # is ready, and tail -f keeps the container alive.)
          - name: sock-fix
            image: docker:29-dind
            command:
              - sh
              - -c
              - while [ ! -S /var/run/docker.sock ]; do sleep 0.5; done; chmod 666 /var/run/docker.sock; echo "docker socket ready (chmod 666)"; tail -f /dev/null
            volumeMounts:
              - name: dind-sock
                mountPath: /var/run
          # The runner talks to the sidecar's daemon via DOCKER_HOST; its
          # entrypoint does not spawn its own dockerd.
          #
          # command is REQUIRED: the actions-runner image's default CMD is a
          # bare shell that exits 0 immediately, so without an explicit command
          # the runner container starts, prints nothing, and exits 0 in ~1s —
          # the controller then marks the ephemeral runner Succeeded and deletes
          # the Pod, leaving jobs queued. The chart's dind mode sets this same
          # command; we set it explicitly because we hand-roll the containers
          # (containerMode is "none") to keep the dind-data /var/lib/docker mount.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command:
              - /home/runner/run.sh
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 8Gi
            volumeMounts:
              - name: dind-sock
                mountPath: /var/run
        volumes:
          # dind-sock: shared socket volume for the dind sidecar + runner.
          # dind-data: /var/lib/docker storage for dockerd (nested overlayfs
          # doesn't work — dockerd needs a real filesystem for image storage).
          # See: https://github.com/siderolabs/talos/discussions/8936
          - name: dind-sock
            emptyDir: {}
          - name: dind-data
            emptyDir: {}
