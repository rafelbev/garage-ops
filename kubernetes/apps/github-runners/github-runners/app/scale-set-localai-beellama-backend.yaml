---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-localai-beellama-backend
spec:
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.1"
  interval: 1h
  values:
    # No containerMode set: the chart defaults to "none", so it uses the
    # explicit containers below (our dind sidecar + runner) instead of
    # injecting its own dind sidecar.
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: github-runners
    runnerScaleSetName: localai-beellama-backend
    githubConfigUrl: https://github.com/rafelbev/localai-beellama-backend
    githubConfigSecret: gha-credentials
    minRunners: 0
    maxRunners: 2
    # dind mode: the backend repo's CI builds + pushes a container image
    # on these runners, so the runner pod needs a docker daemon. The chart
    # adds a dind sidecar + init containers and wires DOCKER_HOST into the
    # runner container (the template below is merged with the dind pod spec).
    containerMode:
      type: dind
    template:
      spec:
        containers:
          # Docker sidecar: runs dockerd in the same Pod; the runner talks to it
          # over the shared socket instead of spawning its own dockerd.
          # DOCKER_TLS_CERTDIR="" disables TLS (and the TCP listener) so the
          # daemon is only reachable over the unix socket, which is what the
          # runner uses via DOCKER_HOST.
          #
          # /var/lib/docker MUST be a volume mount (emptyDir): the container
          # rootfs is overlayfs, and nested overlayfs mounts don't work —
          # dockerd needs a real filesystem for its image storage.
          # See: https://github.com/siderolabs/talos/discussions/8936
          - name: dind
            image: docker:27-dind
            command:
              - dockerd-entrypoint.sh
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: TEST_DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: DOCKER_BUILDKIT
                value: "1"
              - name: DOCKER_GIT_REF
                value: v27.5.1
              - name: DOCKER_TLS_CERTDIR
                value: ""
            volumeMounts:
              - name: dind-sock
                mountPath: /var/run
              - name: dind-data
                mountPath: /var/lib/docker
          # The runner talks to the sidecar's daemon via DOCKER_HOST; its
          # entrypoint does not spawn its own dockerd.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 8Gi
            volumeMounts:
              - name: dind-sock
                mountPath: /var/run
        volumes:
          # dind-sock is provided by the chart's dind containerMode; only
          # add the extra /var/lib/docker volume here (nested overlayfs
          # doesn't work — dockerd needs a real filesystem for image storage).
          # See: https://github.com/siderolabs/talos/discussions/8936
          - name: dind-data
            emptyDir: {}
