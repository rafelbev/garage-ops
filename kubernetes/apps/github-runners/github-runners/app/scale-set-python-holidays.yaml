---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-python-holidays
spec:
  chart:
    spec:
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: gha-runner-charts
      version: "0.15.0"
  interval: 1h
  values:
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: github-runners
    runnerScaleSetName: python-holidays
    githubConfigUrl: https://github.com/rafelbev/python-holidays
    githubConfigSecret: gha-credentials
    minRunners: 0
    maxRunners: 2
    template:
      spec:
        containers:
          - name: runner
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 8Gi
