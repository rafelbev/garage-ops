---
# Route-scoped BackendTrafficPolicy: disable response compression for this route.
#
# Why: the global BackendTrafficPolicy/envoy (network ns) sets
# Zstd/Brotli/Gzip compressors on every route of envoy-external. Envoy's
# compression filter strips the client's Accept-Encoding header from upstream
# requests, which breaks web-UI asset loading (the same class of pitfall that
# forced the llama-cpp route to a route-scoped policy). A route-scoped policy
# fully replaces the global one for this route, so the global retry/keepalive/
# timeout settings are repeated here (the disabled request timeout is required
# for long generations) and the compressor field is deliberately omitted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: local-ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: local-ai
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
