---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-ai
  namespace: local-ai
spec:
  hostnames:
    - local-ai.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: local-ai
          namespace: local-ai
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
