---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-iii
  namespace: firefly-iii
spec:
  hostnames:
    - firefly.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: firefly-iii
          namespace: firefly-iii
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
