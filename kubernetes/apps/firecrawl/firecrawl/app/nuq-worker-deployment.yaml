---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuq-worker
  namespace: firecrawl
  labels:
    app: firecrawl-nuq-worker
spec:
  # Upstream runs 5; 2 is right-sized for a home cluster. These consume
  # the NUQ job queue (scrape/crawl/map jobs) off Postgres.
  replicas: 2
  selector:
    matchLabels:
      app: firecrawl-nuq-worker
  template:
    metadata:
      labels:
        app: firecrawl-nuq-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nuq-worker
          image: ghcr.io/firecrawl/firecrawl:2.11.162
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=3072", "dist/src/services/worker/nuq-worker.js"]
          env:
            - name: FLY_PROCESS_GROUP
              value: "nuq-worker"
            - name: NUQ_WORKER_PORT
              value: "3006"
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
