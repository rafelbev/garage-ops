---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuq-postgres
  namespace: firecrawl
  labels:
    app: firecrawl-nuq-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firecrawl-nuq-postgres
  template:
    metadata:
      labels:
        app: firecrawl-nuq-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # fsGroup only sets the group; chmod needs UID ownership, so a root
        # initContainer chowns the root-owned emptyDir to 999:999 (see below).
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The emptyDir is created root-owned (uid 0) by the kubelet. Running
        # the container as uid 999, initdb fails with "could not change
        # permissions ... Operation not permitted" because it can't chmod a
        # root-owned dir. This root initContainer chowns it to 999:999 first.
        - name: chown-data
          image: ghcr.io/firecrawl/nuq-postgres:latest
          imagePullPolicy: IfNotPresent
          command: ["chown", "-R", "999:999", "/var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: nuq-postgres
          image: ghcr.io/firecrawl/nuq-postgres:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "postgres"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        # Ephemeral by design: this is the NUQ job queue (scrape/crawl
        # job state), not a user database. Matches the upstream
        # cluster-install example, which also uses an emptyDir. Lost on
        # pod restart — in-flight jobs are dropped, no user data.
        - name: postgres-storage
          emptyDir: {}
