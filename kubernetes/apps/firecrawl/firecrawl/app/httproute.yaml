---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firecrawl
  namespace: firecrawl
spec:
  hostnames:
    - firecrawl.garage.neo-tix.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: api
          namespace: firecrawl
          port: 3002
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
