---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl-config
  namespace: firecrawl
data:
  HOST: "0.0.0.0"
  # Redis moved to the shared out-of-cluster instance (see the SOPS secret
  # for REDIS_URL / REDIS_RATE_LIMIT_URL, and the README / AGENTS.md for the
  # per-app db-index allocation).
  PLAYWRIGHT_MICROSERVICE_URL: "http://playwright-service:3000"
  # Database-backed auth (Supabase) is not available self-hosted; requests
  # need no API key. Public traffic is 2FA-gated by Authelia instead.
  USE_DB_AUTHENTICATION: "false"
  ENV: "production"
  IS_KUBERNETES: "true"
  LOGGING_LEVEL: "info"
  # Concurrency tuned down from the upstream compose defaults for a
  # home cluster (see README).
  CRAWL_CONCURRENT_REQUESTS: "10"
  MAX_CONCURRENT_JOBS: "5"
  BROWSER_POOL_SIZE: "5"
  # OpenAI-compatible endpoint for Firecrawl's LLM-backed features
  # (/extract, LLM markdown). Points at the self-hosted LiteLLM proxy;
  # the matching key lives in the SOPS secret as OPENAI_API_KEY.
  OPENAI_BASE_URL: "https://litellm.garage.neo-tix.com/v1"
  # Firecrawl's LLM calls default to gpt-4o-mini; MODEL_NAME overrides that
  # with the model the LiteLLM proxy actually serves (see generic-ai.js
  # getModel: `config.MODEL_NAME || name`).
  MODEL_NAME: "garage/qwen3.8:27B"
  # Firecrawl's embedding calls default to text-embedding-3-small;
  # MODEL_EMBEDDING_NAME overrides that with the embedding model the
  # LiteLLM proxy serves (see generic-ai.ts getEmbeddingModel). This drives
  # the semantic ranker used to rerank search/crawl results.
  MODEL_EMBEDDING_NAME: "garage/granite-embedding"
