---
# One-shot data migration: k3s NFS export -> Talos iSCSI PVC (openterminal).
# NOT Flux-synced (lives outside kubernetes/apps/). Applied manually, runs
# itself, verifies itself, and cleans itself up via TTL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-migration-script
  namespace: openterminal
data:
  migrate.sh: |
    #!/bin/sh
    # Self-contained: rsync /src -> /dst, verify, exit.
    # No network, no prompts, no external services. Safe to run unattended.
    set -eu

    APP="${1:-unknown}"
    SRC=/src/
    DST=/dst/

    log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

    count_files() { find "$1" -type f 2>/dev/null | wc -l; }
    sum_bytes()   { find "$1" -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {printf "%d", s+0}'; }

    log "app=$APP starting migration"
    log "source: files=$(count_files "$SRC") bytes=$(sum_bytes "$SRC")"

    # Guard: source must not be empty (catches a wrong NFS export path)
    if [ "$(count_files "$SRC")" -eq 0 ]; then
      log "FATAL: source is empty - check NFS export path in the Job spec"
      exit 1
    fi

    # Pass 1: full copy. Pass 2: catch writes made during pass 1 + exact mirror.
    rsync -aHAX --stats "$SRC" "$DST"
    rsync -aHAX --delete --stats "$SRC" "$DST"

    src_files=$(count_files "$SRC")
    dst_files=$(count_files "$DST")
    src_bytes=$(sum_bytes "$SRC")
    dst_bytes=$(sum_bytes "$DST")
    log "verification: source files=$src_files bytes=$src_bytes | target files=$dst_files bytes=$dst_bytes"

    if [ "$src_files" = "$dst_files" ] && [ "$src_bytes" = "$dst_bytes" ]; then
      log "MIGRATION_OK app=$APP files=$src_files bytes=$src_bytes"
    else
      log "FATAL: verification mismatch - rerun the job (delete it first)"
      exit 1
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openterminal-migration
  namespace: openterminal
  labels:
    app.kubernetes.io/part-of: ollama-split
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
      containers:
        - name: migrate
          image: alpine:3.21
          command:
            - /bin/sh
            - -c
            - apk add --no-cache rsync >/dev/null 2>&1 && exec /scripts/migrate.sh openterminal
          volumeMounts:
            - name: src-nfs
              mountPath: /src
            - name: dst-pvc
              mountPath: /dst
            - name: script
              mountPath: /scripts
      volumes:
        - name: src-nfs
          nfs:
            server: 172.20.0.10
            path: /mnt/storage/cloud/ollama-open-terminal-pvc-pvc-6e6356d4-e7ab-4e6d-8b29-857c590add33
        - name: dst-pvc
          persistentVolumeClaim:
            claimName: open-terminal-pvc
        - name: script
          configMap:
            name: ollama-migration-script
            defaultMode: 0755
