# User volume: format and mount the 128GB data disk (sde) added to
# cluster-4 for the llama-cpp HuggingFace model cache.
#
# volumeType: disk uses the whole disk (no partition table). Talos wipes,
# formats (ext4) and mounts it at /var/mnt/llama-cpp, persisting across
# reboots. The disk is brand new (no partitions/filesystem), so the
# implicit wipe during provisioning is safe.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: llama-cpp
volumeType: disk
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sde"
filesystem:
  type: ext4
